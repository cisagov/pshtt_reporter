---
# This Docker composition file is used to build and test the container

name: pshtt_reporter

secrets:
  database_creds:
    file: ./src/secrets/database_creds.yml

services:
  pshtt_reporter:
    # Run the container normally
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - redis
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:-gatherer-dev-only}
    image: cisagov/pshtt_reporter
    init: true
    restart: "no"
    secrets:
      - source: database_creds
        target: database_creds.yml

  redis:
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-gatherer-dev-only}
    image: redis:alpine
